<!DOCTYPE html>
<html lang="en">
<head>

    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="masthead">
        <div class="container">
            <nav class="primary-nav">
                <a href="index.html">
                    <img src="data/images/silomax_logo.png" alt="Silomax Logo">
                </a>
                <ul class="nav-links">
                    <li><a href="index.html">Home</a></li>
                    <li><a href="product.html">Product</a></li>

                </ul>
