<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="description" content="Silomax - Kontrollert ensilering fra gras til verdi.">
    <title>Silomax</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="css/main.css">
    <script src="carousel.js"></script>
</head>

<body>
    <header class="masthead">
        <div class="container">
            <nav class="primary-nav">
                <a href="index.html">
                    <img src="data/images/silomax_logo.png" alt="Silomax Logo">
                </a>

                <!-- Hamburger menu -->
                <input type="checkbox" id="menu-toggle" class="menu-toggle">
                <label for="menu-toggle" class="hamburger">
                    <span></span>
                </label>

                <ul class="nav-links">
                    <li><a href="index.html">HJEM</a></li>
                    <li><a href="iq.html">IQ</a></li>
                    <li><a href="stabil.html">STABIL</a></li>
                    <li><a href="faq.html">OSS</a></li>
                </ul>
            </nav>
        </div>
    </header>
    <main>
        <section class="section-product-container section-1">
            <div class="product-header">
                <p class="product-header-main">
                    Mer melk og kjøtt fra gårdens egne ressurser
                </p>
                <p class="product-header-second">
                    Bevist pålitelig under reelle norske forhold i en årrekke. Støttet av vitenskap
                </p>
            </div>
            <div class="container container-products">
                <div class="item item-home">
                    <img class="image image-item image-product" alt="silomax_iq_image"
                        src="data/images/product_images/silomax_iq_transparent.jpg">
                    <div class="item-text text-iq">
                        <p>IQ</p>
                    </div>
                </div>
                <div class="item item-home">
                    <img class="image image-item image-product" alt="silomax_stabil_image"
                        src="data/images/product_images/silomax_stabil_transparent.jpg">
                    <div class="item-text text-stabil">
                        <p>STABIL</p>
                    </div>
                </div>
            </div>
        </section>
        <section class="section-product-container section-2">
            <div class="carousel-item side-item left-item">
                <img class="carousel-item-image" src="/data/images/feedback_images/feedBack_1.png" alt="feedback_1">
            </div>

            <div class="carousel-item main-item">
                <button class="btn carousel-btn carousel-btn-left" aria-label="Previous">&#10094;</button>
                <img class="carousel-item-image" src="/data/images/feedback_images/feedBack_2.png" alt="feedback_2">
                <button class="btn carousel-btn carousel-btn-right" aria-label="Next">&#10095;</button>
            </div>

            <div class="carousel-item side-item right-item">
                <img class="carousel-item-image" src="/data/images/feedback_images/feedBack_3.png" alt="feedback_3">
            </div>
        </section>
    </main>
    <footer class="main-footer">
        <div class="container footer-container">
            <p>&copy; 2004 - 2026 Silomax. All rights reserved.</p>
        </div>
    </footer>
</body>

</html>
