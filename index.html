<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="description" content="Silomax - Kontrollert ensilering fra gras til verdi.">
    <title>Silomax</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="css/main.css">
    <script src="carousel.js"></script>
</head>
<body>
    <header class="masthead">
        <div class="container nav-container">
            <div class="nav-wrap">
                <div class="bubble active"></div>
                <div class="bubble hover"></div>
                <nav class="nav">
                    <a class="active" href="/index.html">Home</a>
                    <a href="/iq.html">Silomax IQ</a>
                    <a href="/stabil.html">Silomax STABIL</a>
                    <a href="/faq.html">FAQ</a>
                </nav>
            </div>
        </div>
    </header>
    <main>
        <section class="container container-elements">
            <div class="product-header">
                <p class="product-header-main">
                    Mer melk og kjøtt fra gårdens egne ressurser
                </p>
                <p class="product-header-second">
                    Bevist pålitelig under reelle norske forhold i en årrekke. Støttet av vitenskap
                </p>
            </div>
            <div class="container-products">
                <div class="item item-home">
                    <img class="image item-image-home" alt="silomax_iq_image"
                        src="data/images/product_images/silomax_iq_transparent.jpg">
                    <div class="item-text text-iq">
                        <p>IQ</p>
                    </div>
                </div>
                <div class="container-products">
                    <div class="item item-home">
                        <img class="image item-image-home" alt="silomax_stabil_image"
                            src="data/images/product_images/silomax_stabil_transparent.jpg">
                        <div class="item-text text-stabil">
                            <p>STABIL</p>
                        </div>
                    </div>
            </div>
        </section>
        <section class="container">
            <div class="container-feedback">
                <button class="btn carousel-btn carousel-btn-left" aria-label="Previous">&#10094;</button>
                
                <div class="carousel-item side-item left-item" data-index="0">
                    <img class="carousel-item-image" src="/data/images/feedback_images/feedBack_1.png" alt="feedback_1">
                </div>
                
                <div class="carousel-item main-item" data-index="1">
                    <img class="carousel-item-image" src="/data/images/feedback_images/feedBack_2.png" alt="feedback_2">
                </div>
                
                <div class="carousel-item side-item right-item" data-index="2">
                    <img class="carousel-item-image" src="/data/images/feedback_images/feedBack_3.png" alt="feedback_3">
                </div>
                
                <button class="btn carousel-btn carousel-btn-right" aria-label="Next">&#10095;</button>
                
                <div class="carousel-item hidden-item" data-index="3">
                    <img class="carousel-item-image" src="/data/images/feedback_images/feedBack_4.png" alt="feedback_4">
                </div>
                
                <div class="carousel-item hidden-item" data-index="4">
                    <img class="carousel-item-image" src="/data/images/feedback_images/feedBack_5.png" alt="feedback_5">
                </div>
                
                <div class="carousel-item hidden-item" data-index="5">
                    <img class="carousel-item-image" src="/data/images/feedback_images/feedBack_6.png" alt="feedback_6">
                </div>
            </div>
        </section>
    </main>
    <footer class="main-footer">
        <div class="container footer-container">
            <p>&copy; 2004 - 2026 Silomax. All rights reserved.</p>
        </div>
    </footer>
</body>

</html>
